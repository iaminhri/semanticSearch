<!DOCTYPE html>
{% load static %}  
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Semantic Search</title>    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>
<body>

    <div class="myDiv">
        <a class="custom-active" href="{% url 'home' %}"><i class="fa fa-fw fa-home"></i> Home</a> 
        <a href=" {% url 'upload' %} "><i class="fa fa-fw fa-cloud-upload"></i> Upload Video</a> 
        <a href="{% url 'train' %}"><i class="fa fa-cogs"></i> Index Videos</a> 
        <a href="{% url 'serve' %}"><i class="fa fa-folder-open"></i> Archive </a> 
    </div>
    
    <div class="progress" style="margin-top: 20px;">
        <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
    </div>
    <div id="progress-status" class="alert alert-info mt-2">Initializing...</div>

    <script>
        var checkProgressUrl = "{% url 'check_progress' %}";
        $(document).ready(function() {
            function checkProgress() {
                $.ajax({
                    url: checkProgressUrl, 
                    method: 'GET',
                    success: function(data) {
                        console.log(data)
                        if (data.status === 'running') {
                            $('#progress-bar').css('width', data.progress).attr('aria-valuenow', data.progress).text(data.progress);
                            $('#progress-status').text('Process is running...');
                        } else if (data.status === 'completed') {
                            $('#progress-bar').css('width', '100%').attr('aria-valuenow', 100).text('100%');
                            $('#progress-status').removeClass('alert-info').addClass('alert-success').text('Process has completed.');
                            clearInterval(progressInterval);
                        } else {
                            $('#progress-status').removeClass('alert-info').addClass('alert-danger').text('Error: ' + data.message);
                            clearInterval(progressInterval);
                        }
                    },
                    error: function() {
                        $('#progress-status').removeClass('alert-info').addClass('alert-danger').text('Failed to check progress.');
                        clearInterval(progressInterval);
                    }
                });
            }
            var progressInterval = setInterval(checkProgress, 1000);  // Poll every second
        });
    </script>   
</body>
</html>
